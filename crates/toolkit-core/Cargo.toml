[package]
name = "toolkit-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Host-independent Toolkit profile backend"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
sha2 = "=0.10.9"
dunce = "=1.0.5"
ts-rs = { version = "=12.0.1", features = ["serde-json-impl"], optional = true }

[features]
export-types = ["dep:ts-rs"]

[dev-dependencies]
base64 = "=0.22.1"

[build-dependencies]
sha2 = "=0.10.9"

[[example]]
name = "export-contracts"
required-features = ["export-types"]
