<!doctype html><meta charset="utf-8"><title>Schau</title>
<style>html,body{margin:0;background:#1b1b1b}#isoDockBody{width:1000px;height:760px}
#isoDockCanvas{width:100%;height:100%;display:block}#isoDockStatus{color:#ddd;font:12px monospace;padding:4px}</style>
<div id="isoDockBody"><canvas id="isoDockCanvas"></canvas></div>
<div id="isoDockStatus"></div>
<script>
// Ein Ersatz-Editor: genau das, was iso-view.js von ihm abfragt.
const p = new URLSearchParams(location.search);
window.castleEditor = {
  hasDocument: () => true,
  // Der Bergfried auf Dorffeld (43,43). Der Versatz in der AIV zaehlt die
  // Zeile umgedreht: (99-43)*100 + 43 = 5643.
  getDocument: () => ({ frames: p.get('leer') ? [] : [{ itemType: 61, tilePositionOfsets: [5643] }] }),
  getTool: () => 'schau',
  addChangeListener: () => {}
};
</script>
<script src="js/castle-camera.js"></script>
<script src="js/iso-geometry.js"></script>
<script src="js/iso-view.js"></script>
<script>
(async () => {
  await window.isoView.mountDock();
  const karte = await (await fetch('/karte?name=' + encodeURIComponent(p.get('karte') || 'A Friend Indeed'))).json();
  // Zum Messen: die Drehung kann per ?dreh=0 erzwungen werden. Bei 0 lag der
  // Bergfried nachweislich richtig - deckt es dort und sonst nicht, ist die
  // Verschiebung nach der Drehung schuld.
  if (p.has('dreh') && karte.keeps[0]) karte.keeps[0].orientation = Number(p.get('dreh'));
  window.isoView.setGameMap(karte);
  window.isoView.setGameMapKeep(Number(p.get('platz') || 0));
  // Gezeichnet wird aus dem Kachelvorrat. Mit ?modus=preview bleibt er weg,
  // dann liegt die schnelle Vorschau darunter - derselbe Rueckfall wie im
  // Editor, wenn der Vorrat nicht kommt.
  if (p.get('modus') !== 'preview') {
    window.isoView.setMapTiles(await (await fetch('/kacheln?name=' + encodeURIComponent(karte.name))).json());
  }
  window.isoView.fit();
  window.isoView.paint();
  // Erst wenn der Atlas geladen ist, steht das Bild. Sonst fotografiert der
  // Betrachter einen leeren Grund und haelt ihn fuer das Ergebnis.
  setTimeout(() => { window.isoView.paint(); document.title = 'fertig'; }, 1500);
})();
</script>
